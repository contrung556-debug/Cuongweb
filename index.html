<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo Dõi Đơn Hàng Shopee</title>
    <!-- Thư viện kết nối Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f6f6f6; margin: 0; padding: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; box-sizing: border-box; margin-bottom: 20px; text-align: center; }
        h2 { color: #ee4d2d; text-align: center; margin-top: 0; font-size: 22px; margin-bottom: 20px; text-transform: uppercase; }
        label { font-weight: 600; display: block; margin-bottom: 8px; color: #333; font-size: 15px; text-align: left; }
        .input-group { position: relative; margin-bottom: 20px; display: flex; align-items: center; width: 100%; }
        input[type="text"] { width: 100%; padding: 14px; border: 1.5px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: border 0.3s; -webkit-appearance: none; }
        input[type="text"]:focus { border-color: #ee4d2d; outline: none; }
        button { width: 100%; padding: 14px; background-color: #ee4d2d; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; -webkit-appearance: none; text-transform: uppercase; }
        button:active { background-color: #d73c1f; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .result-box { margin-top: 25px; padding: 15px; border-radius: 8px; background-color: #fafafa; border: 1px solid #e6e6e6; display: none; box-sizing: border-box; text-align: left; }
        .status-success { border-left: 5px solid #2ecc71; }
        .status-error { border-left: 5px solid #e74c3c; }
        .status-loading { border-left: 5px solid #3498db; text-align: center; color: #666; font-weight: 500; }
        .data-item { margin-bottom: 12px; font-size: 15px; word-break: break-all; color: #444; }
        .data-label { font-weight: bold; color: #666; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .verify-btn { flex: 2; display: block; text-align: center; padding: 12px; background-color: #2ecc71; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; box-sizing: border-box; min-width: 120px; }
        .copy-btn, .copy-otp-btn { flex: 1; padding: 12px; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; min-width: 100px; }
        .copy-btn { background-color: #3498db; }
        .copy-otp-btn { background-color: #e67e22; }
        .otp-display { font-size: 26px; font-weight: bold; color: #ee4d2d; letter-spacing: 1px; margin: 5px 0; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Theo Dõi Đơn Hàng Shopee</h2>
    
    <label for="orderCodeInput">Mã đơn hàng (ID):</label>
    <div class="input-group">
        <input type="text" id="orderCodeInput" placeholder="Ví dụ: #260909J3YPFEUP">
    </div>

    <label for="productNameInput">Tên sản phẩm:</label>
    <div class="input-group">
        <input type="text" id="productNameInput" placeholder="Ví dụ: Túi Viên Giặt Xả MaxKleen">
    </div>

    <label for="emailInput">Tên hoặc địa chỉ Email:</label>
    <div class="input-group">
        <input type="text" id="emailInput" placeholder="Ví dụ: 14.hour.pines" inputmode="email">
    </div>
    
    <button id="saveAndFetchBtn" onclick="saveAndTrackOrder()">Lưu Đơn & Quét Thư</button>
    
    <div id="loadingBox" class="result-box status-loading">Đang lưu đơn và kết nối hộp thư quét dữ liệu...</div>
    
    <div id="resultBox" class="result-box"></div>
</div>

<script>
    // Cấu hình kết nối Supabase
    const SUPABASE_URL = "https://hsdbjzkxbdezysxwwtaw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_LIeDI4UVn7MEo5vURP05hA_TM4h0vFd";

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const webAppUrl = "https://script.google.com/macros/s/AKfycbwk0RSNFUrzaU7nSlNgAgazt3BWUNR-meYBYvJcSkJIFxQe4XiDfGd3FsfcSTWzOLk/exec";

    async function saveAndTrackOrder() {
        let orderCode = document.getElementById("orderCodeInput").value.trim();
        let productName = document.getElementById("productNameInput").value.trim();
        let emailInput = document.getElementById("emailInput").value.trim();
        const fetchBtn = document.getElementById("saveAndFetchBtn");
        const loadingBox = document.getElementById("loadingBox");
        const resultBox = document.getElementById("resultBox");
        
        if (!orderCode || !productName || !emailInput) {
            alert("Vui lòng nhập đầy đủ Mã đơn hàng, Tên sản phẩm và Email!");
            return;
        }
        
        let cleanEmail = emailInput;
        if (cleanEmail.toLowerCase().endsWith("@icloud.com")) {
            cleanEmail = cleanEmail.substring(0, cleanEmail.toLowerCase().lastIndexOf("@icloud.com"));
        }
        
        fetchBtn.disabled = true;
        loadingBox.style.display = "block";
        resultBox.style.display = "none";
        
        // 1. Lưu Mã đơn hàng, Tên sản phẩm và Email vào Supabase
        const { error: dbError } = await _supabase
            .from('shopee_orders')
            .insert([
                { 
                    order_code: orderCode, 
                    product_name: productName,
                    email: emailInput, 
                    status: 'Đang chờ giao' 
                }
            ]);

        if (dbError) {
            console.error('Lỗi lưu Database:', dbError);
            alert('Lỗi khi lưu vào cơ sở dữ liệu!');
            fetchBtn.disabled = false;
            loadingBox.style.display = "none";
            return;
        }

        // 2. Gọi Google Apps Script quét email đồng thời
        const callbackName = "shopee_callback_" + Math.round(Math.random() * 100000);
        
        window[callbackName] = function(data) {
            const oldScript = document.getElementById(callbackName);
            if (oldScript) { oldScript.parentNode.removeChild(oldScript); }
            delete window[callbackName];
            
            loadingBox.style.display = "none";
            fetchBtn.disabled = false;
            resultBox.style.display = "block";
            
            if (data.status === "success") {
                resultBox.classList.add("status-success");
                
                let displayTime = data.thoi_gian_nhan_thu;
                if(data.thoi_gian_nhan_thu && data.thoi_gian_nhan_thu.indexOf('T') !== -1) {
                    displayTime = new Date(data.thoi_gian_nhan_thu).toLocaleString('vi-VN');
                }
                
                let actionButtonsHtml = '';
                let otpDisplayHtml = data.otp;

                if (data.otp && data.otp !== "Không có") {
                    actionButtonsHtml += `
                        <button class="copy-otp-btn" onclick="copyToClipboard('${data.otp}', 'Đã copy mã OTP thành công!')">COPY OTP</button>
                    `;
                } else if (data.link_xac_thuc_tai_day && data.link_xac_thuc_tai_day !== "Không có") {
                    otpDisplayHtml = "Chỉ có link";
                    actionButtonsHtml += `
                        <a href="${data.link_xac_thuc_tai_day}" target="_blank" class="verify-btn">MỞ LINK</a>
                        <button class="copy-btn" onclick="copyToClipboard('${data.link_xac_thuc_tai_day}', 'Đã copy link thành công!')">COPY LINK</button>
                    `;
                }
                
                resultBox.innerHTML = `
                    <div class="data-item" style="color: #27ae60; font-weight: bold;">✔ Đã lưu đơn hàng vào hệ thống thành công!</div>
                    <div class="data-item"><span class="data-label">Mã đơn hàng:</span> ${orderCode}</div>
                    <div class="data-item"><span class="data-label">Tên sản phẩm:</span> ${productName}</div>
                    <div class="data-item"><span class="data-label">Kết quả mã số:</span> <div class="otp-display">${otpDisplayHtml}</div></div>
                    <div class="data-item"><span class="data-label">Thời gian nhận thư:</span> <span style="color:#d35400; font-weight:bold;">${displayTime}</span></div>
                    <div class="action-buttons">${actionButtonsHtml}</div>
                `;
            } else {
                resultBox.classList.add("status-error");
                resultBox.innerHTML = `
                    <div class="data-item" style="color: #2e7d32; font-weight: bold; margin-bottom: 8px;">✔ Đã lưu đơn "${productName}" vào database chờ quét ngầm.</div>
                    <div class="data-item" style="color:#e74c3c;">Trạng thái quét ngay: ${data.message}</div>
                `;
            }
        };
        
        const script = document.createElement('script');
        script.id = callbackName;
        script.src = `${webAppUrl}?hide=${encodeURIComponent(cleanEmail)}&callback=${callbackName}`;
        document.body.appendChild(script);
    }

    function copyToClipboard(text, successMessage) {
        navigator.clipboard.writeText(text).then(() => {
            alert(successMessage);
        });
    }
</script>

</body>
</html>
