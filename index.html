<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lưu Dữ Liệu Thuần</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f6f6f6; margin: 0; padding: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        h2 { color: #ee4d2d; margin-top: 0; font-size: 18px; margin-bottom: 20px; text-transform: uppercase; border-bottom: 2px solid #ee4d2d; padding-bottom: 8px; }
        input { width: 100%; padding: 14px; border: 1.5px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; margin-bottom: 20px; }
        input:focus { border-color: #ee4d2d; }
        button { width: 100%; padding: 14px; background-color: #ee4d2d; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:active { background-color: #d73c1f; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kiểm Tra Lưu Data D1</h2>
    
    <input type="text" id="textInput" placeholder="Nhập chữ bất kỳ vào đây để test lưu...">
    
    <button id="saveBtn" onclick="testLuuDuLieuThuand()">Bấm Để Lưu</button>
</div>

<script>
    // Link API Cloudflare Worker của bạn
    const CLOUDFLARE_URL = "https://workers.dev";

    async function testLuuDuLieuThuand() {
        const textVal = document.getElementById('textInput').value.trim();
        const saveBtn = document.getElementById('saveBtn');

        if (!textVal) {
            alert("Vui lòng gõ chữ vào ô trống trước khi bấm lưu!");
            return;
        }

        saveBtn.disabled = true;
        saveBtn.innerText = "ĐANG GỬI...";

        try {
            // Sử dụng cổng /sync-apps-script có sẵn trong Worker để test đẩy data thô lên hòm D1
            const response = await fetch(`${CLOUDFLARE_URL}/sync-apps-script`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: textVal, // Đưa chuỗi bạn nhập vào cột Email
                    otp: "Mã Test",
                    time: new Date().toLocaleString('vi-VN'),
                    link: "Link Test",
                    is_order_success: false
                })
            });

            const result = await response.json();

            if (response.ok && result.success === true) {
                // NỔ THÔNG BÁO KHI LƯU THÀNH CÔNG VỀ DATABASE D1
                alert("🎉 THÀNH CÔNG! Dữ liệu đã được gửi và lưu trữ vĩnh viễn vào Database Cloudflare D1.");
                document.getElementById('textInput').value = ""; // Xóa sạch ô nhập để nhập từ mới
            } else {
                alert("❌ THẤT BẠI: Cloudflare Worker từ chối lưu dữ liệu!");
            }

        } catch (error) {
            alert("❌ LỖI KẾT NỐI: Không thể gửi dữ liệu tới Cloudflare Worker! Hãy kiểm tra mạng hoặc cấu hình CORS dấu sao (*) trên Worker.");
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = "BẤM ĐỂ LƯU";
        }
    }
</script>

</body>
</html>
